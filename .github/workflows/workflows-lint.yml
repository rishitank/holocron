# actionlint over this repo's workflows. Catches bad `uses:` refs, undefined
# contexts and shell bugs in `run:` blocks before they cost a red build.
name: workflows-lint

on:
  pull_request:
    paths: [".github/workflows/**"]
  push:
    branches: [main]
    paths: [".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    uses: rishitank/.github/.github/workflows/workflows-lint.yml@5d5a5b8b43d7a62a85ee369502651f4fa97ac922 # v1
