# Vulnerable dependencies (osv-scanner), leaked secrets (gitleaks, full
# history) and the ecosystem's own audit, via the shared workflow.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "40 4 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    uses: rishitank/.github/.github/workflows/security.yml@5d5a5b8b43d7a62a85ee369502651f4fa97ac922 # v1
    with:
      ecosystem: node
