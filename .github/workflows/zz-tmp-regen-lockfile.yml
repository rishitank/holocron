# TEMPORARY: regenerates package-lock.json for the fix/dependabot-alerts branch.
# Deleted by a follow-up commit on the same branch; never meant to reach main.
name: zz-tmp regenerate lockfile

on:
  push:
    branches: [fix/dependabot-alerts]
    paths: ['.github/workflows/zz-tmp-regen-lockfile.yml', 'package.json']

permissions:
  contents: write

jobs:
  regen:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/dependabot-alerts

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Regenerate lockfile
        run: |
          set -euo pipefail
          node -v && npm -v
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          # Move vulnerable transitive deps to the newest version their parents allow
          npm update --package-lock-only --ignore-scripts --no-audit --no-fund \
            hono @hono/node-server fast-uri find-my-way express-rate-limit path-to-regexp \
            ip-address qs body-parser js-yaml postcss brace-expansion nanoid flatted \
            minimatch rollup picomatch @humanfs/node esbuild vite

      - name: Audit must be clean
        run: npm audit --audit-level=low

      - name: Install from the new lockfile
        run: npm ci

      - name: Commit lockfile
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --quiet && { echo 'lockfile unchanged'; exit 0; }
          git commit -m 'fix(security): regenerate package-lock.json' -m 'Generated by the temporary zz-tmp-regen-lockfile workflow: npm install --package-lock-only, then npm update --package-lock-only of the vulnerable transitive packages.'
          git push origin HEAD:fix/dependabot-alerts
