# ONE-SHOT, TEMPORARY. Runs a dependency-update command on a GitHub runner and
# commits the resulting lockfile change back to this branch, so a lockfile
# never has to be hand-transcribed. Deleted again in the very next commit.
name: deps-refresh-once

on:
  push:
    branches: [ci/hygiene]
    paths: [.github/workflows/deps-refresh-once.yml]

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: current
      - name: Update
        run: |
          set -euxo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify the lockfile installs
        run: |
          set -euxo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit
        env:
          COMMAND: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -q -- .github/workflows/deps-refresh-once.yml || true
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git --no-pager diff --cached --stat
          git commit -m "chore(deps): refresh lockfile to pick up patched versions" -m "Ran on a runner by the one-shot deps-refresh-once workflow: ${COMMAND}"
          git push
