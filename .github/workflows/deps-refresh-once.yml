# ONE-SHOT, TEMPORARY. Runs a dependency-update command on a GitHub runner and
# commits the resulting lockfile change back to this branch, so a lockfile
# never has to be hand-transcribed. Delete this file in the very next commit
# (that commit, pushed by a person/agent rather than GITHUB_TOKEN, is what
# triggers CI on the refreshed lockfile).
name: deps-refresh-once

on:
  push:
    branches: [ci/hygiene]
    paths: [.github/workflows/deps-refresh-once.yml]

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        if: contains(fromJSON('["node","pnpm","bun"]'), 'node')
        with:
          node-version: current
      - uses: pnpm/action-setup@v6.0.10
        if: "'node' == 'pnpm'"
        with:
          package_json_file: ./package.json
      - uses: oven-sh/setup-bun@v2.2.0
        if: "'node' == 'bun'"
      - uses: actions/setup-python@v7.0.0
        if: "'node' == 'python'"
        with:
          python-version: "3.12"
      - name: Update
        run: |
          set -euxo pipefail
          npm update --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify the lockfile installs
        run: |
          set -euxo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls esbuild --all
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .
          git reset -q -- node_modules .github/workflows/deps-refresh-once.yml || true
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git --no-pager diff --cached --stat
          git commit -m "chore(deps): refresh lockfile to pick up patched versions" -m "Ran on a runner by the one-shot deps-refresh-once workflow: npm update --package-lock-only --ignore-scripts --no-audit --no-fund"
          git push
